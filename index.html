<!DOCTYPE html>
<html lang="fa" dir="rtl">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>پلتفرم مطالعات اجتماعی | Social Studies Hub</title>
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&family=Vazirmatn:wght@400;500;600;700;800&display=swap" rel="stylesheet" />
  
  <style>
    :root {
      --bg: #f5f7fa; --surface: #ffffff; --surface-alt: #eef2f6; --text: #14202c;
      --primary: #0f4c81; --primary-hover: #163a5f; --muted: #58697a; --accent: #0d9488;
      --border: #dce3ec; --radius: 14px; --shadow: 0 8px 24px rgba(15, 76, 129, 0.06);
      --font-fa: "Vazirmatn", "system-ui", sans-serif; --font-en: "Inter", "system-ui", sans-serif;
    }

    html[lang="fa"] body { font-family: var(--font-fa); font-size: 15px; }
    html[lang="en"] body { font-family: var(--font-en); font-size: 15px; }

    * { box-sizing: border-box; margin: 0; padding: 0; }
    body { background: var(--bg); color: var(--text); line-height: 1.7; min-height: 100vh; }
    .container { max-width: 1240px; margin: 0 auto; padding: 20px; }

    header { background: var(--surface); border-bottom: 1px solid var(--border); position: sticky; top: 0; z-index: 40; }
    .topbar { display: flex; align-items: center; justify-content: space-between; gap: 14px; padding: 14px 0; flex-wrap: wrap; }
    .brand { display: flex; align-items: center; gap: 10px; font-weight: 800; font-size: 1.12rem; color: var(--primary); cursor: pointer; }
    .brand-badge { background: linear-gradient(135deg, var(--primary), var(--accent)); color: #fff; padding: 6px 10px; border-radius: 10px; font-size: 0.85rem; }
    .header-actions { display: flex; align-items: center; gap: 10px; flex-wrap: wrap; }
    
    button, input, select, textarea { font-family: inherit; }
    .btn { border: 1px solid var(--border); background: var(--surface); color: var(--text); padding: 8px 14px; border-radius: 10px; cursor: pointer; font-weight: 600; font-size: 0.9rem; transition: all 0.2s ease; text-decoration: none; display: inline-block; }
    .btn:hover { border-color: var(--primary); color: var(--primary); }
    .btn-primary { background: var(--primary); color: #fff; border-color: var(--primary); }
    .btn-primary:hover { background: var(--primary-hover); color: #fff; }
    .btn-accent { background: var(--accent); color: #fff; border-color: var(--accent); }

    .nav-tabs { display: flex; gap: 6px; overflow-x: auto; padding-bottom: 10px; margin-top: 10px; }
    .nav-tab { border: none; background: transparent; color: var(--muted); padding: 9px 15px; border-radius: 10px; cursor: pointer; font-weight: 600; font-size: 0.92rem; white-space: nowrap; }
    .nav-tab:hover { background: var(--surface-alt); color: var(--text); }
    .nav-tab.active { background: var(--primary); color: #fff; }

    /* پس‌زمینه تیره و شیک برای هیرو */
    .hero { margin: 22px 0; background: linear-gradient(135deg, #0f2027 0%, #203a43 50%, #2c5364 100%); color: #fff; border-radius: 20px; padding: 35px 28px; box-shadow: 0 10px 30px rgba(0,0,0,0.15); text-align: center; }
    .hero h1 { font-size: 1.9rem; line-height: 1.4; margin-bottom: 12px; font-weight: 800; }
    .hero p { opacity: 0.85; margin-bottom: 0; max-width: 800px; margin: 0 auto; font-size: 1.05rem; }
    
    .section-head { display: flex; align-items: center; justify-content: space-between; gap: 12px; margin: 20px 0 14px; flex-wrap: wrap; }
    .section-title { font-size: 1.25rem; font-weight: 800; }
    .toolbar { display: flex; gap: 10px; flex-wrap: wrap; margin-bottom: 18px; }
    .input, select, textarea { border: 1px solid var(--border); background: var(--surface); color: var(--text); padding: 9px 12px; border-radius: 10px; font-size: 0.92rem; }
    .grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(310px, 1fr)); gap: 18px; margin-bottom: 30px; }

    .card { background: var(--surface); border: 1px solid var(--border); border-radius: var(--radius); padding: 18px; box-shadow: var(--shadow); display: flex; flex-direction: column; justify-content: space-between; gap: 14px; }
    .card-top { display: flex; justify-content: space-between; align-items: center; gap: 8px; flex-wrap: wrap; }
    .tag { background: var(--surface-alt); color: var(--primary); padding: 4px 10px; border-radius: 999px; font-size: 0.78rem; font-weight: 700; }
    .price { font-weight: 800; color: var(--accent); font-size: 0.95rem; }
    .card h3 { font-size: 1.05rem; line-height: 1.45; }
    .card-footer { display: flex; justify-content: space-between; align-items: center; gap: 8px; border-top: 1px solid var(--surface-alt); padding-top: 12px; }
    
    .panel { background: var(--surface); border: 1px solid var(--border); border-radius: var(--radius); padding: 20px; box-shadow: var(--shadow); margin-bottom: 24px; }
    
    /* فوتر تمیز و بدون جمله آزمایشی */
    footer { border-top: 1px solid var(--border); background: var(--surface); padding: 20px 0; color: var(--muted); font-size: 0.9rem; text-align: center; font-weight: 600; }

    .hidden { display: none !important; }
  </style>
</head>
<body>
  <header>
    <div class="container">
      <div class="topbar">
        <div class="brand" onclick="showHome()">
          <span class="brand-badge">SSH</span>
          <span id="brandTitle">پلتفرم مطالعات اجتماعی</span>
        </div>
        <div class="header-actions">
          <button class="btn" id="langToggle" type="button">English</button>
          <button class="btn" id="openPublishBtn" type="button">+ انتشار / فروش</button>
          <button class="btn btn-primary" id="openAuthBtn" type="button">حساب کاربری و پنل</button>
        </div>
      </div>
      <div class="nav-tabs" id="mainNav"></div>
    </div>
  </header>

  <main class="container">
    
    <!-- صفحه اصلی -->
    <div id="homeView">
      <section class="hero">
        <h1 id="heroTitle">پلتفرم یکپارچه پژوهش، آموزش، آمار، همایش، کتاب و پادکست</h1>
        <p id="heroDesc">با پشتیبانی هم‌زمان از فروش مستقیم و بازارچه کارمزدی محصولات کاربران، پنل شخصی و تغییر زبان فارسی و انگلیسی.</p>
      </section>

      <div class="section-head">
        <h2 class="section-title" id="activeModuleTitle">پژوهش</h2>
        <span id="activeUserBadge" class="tag">کاربر مهمان</span>
      </div>

      <div class="grid" id="itemsGrid"></div>
    </div>

    <!-- صفحه کاتالوگ -->
    <div id="catalogView" class="hidden">
      <div class="section-head" style="margin-top: 0;">
        <h2 class="section-title" id="catalogTitle">آرشیو</h2>
        <button class="btn" onclick="showHome()">بازگشت به صفحه اصلی</button>
      </div>

      <div class="toolbar">
        <input class="input" id="catalogSearch" type="search" placeholder="جستجو در عنوان یا چکیده..." style="flex:1;min-width:220px;" />
        <select id="catalogCategoryFilter" class="input"></select>
      </div>

      <div class="grid" id="catalogGrid"></div>
    </div>

  </main>

  <footer>
    <div class="container" id="footerText">
      © پلتفرم مطالعات اجتماعی - تمامی حقوق محفوظ است.
    </div>
  </footer>

  <script>
    // دیتابیس مرکزی
    const allData = [
      { type: "research", category: "جامعه‌شناسی", title: "تأثیر شبکه‌های اجتماعی بر سبک زندگی", desc: "بررسی ابعاد مختلف اجتماعی و روانی...", price: 0, link: "article-1.html" },
      { type: "research", category: "سیاست", title: "تحلیل سرمایه اجتماعی در کلان‌شهرها", desc: "پژوهشی در مورد چگونگی شکل‌گیری اعتماد...", price: 0, link: "#" },
      { type: "education", category: "کارگاه", title: "دوره روش تحقیق در مطالعات اجتماعی", desc: "برگزاری کلاس، تکالیف و ارزیابی مهارتی...", price: 1100000, link: "#" },
      { type: "statistics", category: "داده‌های شهری", title: "مجموعه داده تحلیل شده پیمایش شهری", desc: "انتشار و فروش داده تحلیل شده...", price: 450000, link: "#" },
      { type: "conference", category: "همایش ملی", title: "ثبت نام همایش جامعه شناسی", desc: "شرکت در همایش و دریافت گزارش...", price: 550000, link: "#" },
      { type: "books", category: "تألیف", title: "کتاب نهادهای اجتماعی معاصر", desc: "عرضه کتاب و خلاصه تخصصی...", price: 320000, link: "#" },
      { type: "podcasts", category: "گفت‌وگو", title: "پادکست تحولات اجتماعی", desc: "تهیه و انتشار اپیزودهای تحلیلی...", price: 0, link: "#" }
    ];

    const pageConfigs = {
      research: { titleFa: "آرشیو پژوهش‌ها", titleEn: "Research Archive", categories: ["همه موضوعات", "جامعه‌شناسی", "سیاست"] },
      education: { titleFa: "دوره‌های آموزشی", titleEn: "Education", categories: ["همه موضوعات", "کارگاه", "وبینار"] },
      statistics: { titleFa: "آمار و داده‌ها", titleEn: "Statistics", categories: ["همه موضوعات", "داده‌های شهری"] },
      conference: { titleFa: "همایش‌ها", titleEn: "Conferences", categories: ["همه موضوعات", "همایش ملی"] },
      books: { titleFa: "کتاب‌ها", titleEn: "Books", categories: ["همه موضوعات", "تألیف", "ترجمه"] },
      podcasts: { titleFa: "پادکست‌ها", titleEn: "Podcasts", categories: ["همه موضوعات", "گفت‌وگو"] }
    };

    const state = {
      lang: "fa", currentView: "home", activeModule: "research", catalogType: "research",
      catalogSearch: "", catalogCategory: "all"
    };

    const i18n = {
      fa: {
        brand: "پلتفرم مطالعات اجتماعی", langBtn: "English", publishBtn: "+ انتشار / فروش", authBtn: "حساب کاربری",
        heroTitle: "پلتفرم یکپارچه پژوهش، آموزش، آمار، همایش، کتاب و پادکست",
        heroDesc: "با پشتیبانی هم‌زمان از فروش مستقیم و بازارچه کارمزدی محصولات کاربران، پنل شخصی و تغییر زبان فارسی و انگلیسی.",
        freeText: "رایگان", modules: { research: "پژوهش", education: "آموزش", statistics: "آمار", conference: "همایش", books: "کتاب", podcasts: "پادکست" }
      },
      en: {
        brand: "Social Studies Platform", langBtn: "فارسی", publishBtn: "+ Publish / Sell", authBtn: "Account",
        heroTitle: "Unified Platform for Social Studies",
        heroDesc: "Supporting direct sales, creator commission items, personal dashboard, and bilingual UI.",
        freeText: "Free", modules: { research: "Research", education: "Education", statistics: "Statistics", conference: "Conference", books: "Books", podcasts: "Podcasts" }
      }
    };

    function formatPrice(price) {
      if (price === 0) return i18n[state.lang].freeText;
      return price.toLocaleString(state.lang === "fa" ? 'fa-IR' : 'en-US') + (state.lang === "fa" ? " تومان" : " IRR");
    }

    function renderNav() {
      const nav = document.getElementById('mainNav');
      const mods = i18n[state.lang].modules;
      nav.innerHTML = "";
      Object.keys(mods).forEach((key) => {
        const b = document.createElement('button');
        b.type = "button";
        b.className = `nav-tab ${(state.currentView === 'home' && state.activeModule === key) || (state.currentView === 'catalog' && state.catalogType === key) ? "active" : ""}`;
        b.textContent = mods[key];
        b.onclick = () => openCatalog(key);
        nav.appendChild(b);
      });
    }

    function renderItems() {
      const grid = document.getElementById('itemsGrid');
      const list = allData.filter(item => item.type === state.activeModule).slice(0, 4);
      
      grid.innerHTML = list.length === 0 ? `<div class="panel"><p>موردی یافت نشد.</p></div>` : "";

      list.forEach(item => {
        const card = document.createElement('article');
        card.className = 'card';
        card.innerHTML = `
          <div>
            <div class="card-top"><span class="tag">${item.category}</span><span class="price">${formatPrice(item.price)}</span></div>
            <h3 style="margin-top:10px;">${item.title}</h3>
            <p style="margin-top:6px;">${item.desc}</p>
          </div>
          <div class="card-footer">
            <span style="font-size:0.82rem; color:var(--muted);">${i18n[state.lang].modules[item.type]}</span>
            <button type="button" class="btn btn-primary" onclick="openCatalog('${item.type}')">مشاهده همه</button>
          </div>
        `;
        grid.appendChild(card);
      });
    }

    function renderCatalog() {
      const config = pageConfigs[state.catalogType];
      document.getElementById('catalogTitle').textContent = state.lang === "fa" ? config.titleFa : config.titleEn;
      
      const filter = document.getElementById('catalogCategoryFilter');
      filter.innerHTML = "";
      config.categories.forEach(cat => {
        const opt = document.createElement('option');
        opt.value = cat === "همه موضوعات" ? "all" : cat;
        opt.textContent = cat;
        filter.appendChild(opt);
      });

      const grid = document.getElementById('catalogGrid');
      const q = state.catalogSearch.toLowerCase();
      
      const filtered = allData.filter(item => {
        return item.type === state.catalogType && (item.title.toLowerCase().includes(q) || item.desc.toLowerCase().includes(q));
      });

      grid.innerHTML = filtered.length === 0 ? '<p style="grid-column: 1/-1; text-align: center; color: var(--muted);">موردی یافت نشد.</p>' : "";

      filtered.forEach(item => {
        const card = document.createElement('div');
        card.className = 'card';
        card.innerHTML = `
          <div>
            <div class="card-top"><span class="tag">${item.category}</span><span class="price">${formatPrice(item.price)}</span></div>
            <h3 style="margin-top:10px;">${item.title}</h3>
            <p style="margin-top:6px;">${item.desc}</p>
          </div>
          <div class="card-footer">
            <a href="${item.link}" class="btn btn-accent" style="text-decoration:none;">مشاهده جزئیات &larr;</a>
          </div>
        `;
        grid.appendChild(card);
      });
    }

    function updateUI() {
      const t = i18n[state.lang];
      document.documentElement.lang = state.lang;
      document.documentElement.dir = state.lang === "fa" ? "rtl" : "ltr";
      document.getElementById('brandTitle').textContent = t.brand;
      document.getElementById('langToggle').textContent = t.langBtn;
      document.getElementById('openPublishBtn').textContent = t.publishBtn;
      document.getElementById('openAuthBtn').textContent = t.authBtn;
      document.getElementById('heroTitle').textContent = t.heroTitle;
      document.getElementById('heroDesc').textContent = t.heroDesc;
      document.getElementById('activeModuleTitle').textContent = t.modules[state.activeModule];
    }

    function showHome() {
      state.currentView = "home";
      document.getElementById('homeView').classList.remove('hidden');
      document.getElementById('catalogView').classList.add('hidden');
      renderNav();
      renderItems();
    }

    function openCatalog(type) {
      state.currentView = "catalog";
      state.catalogType = type;
      document.getElementById('homeView').classList.add('hidden');
      document.getElementById('catalogView').classList.remove('hidden');
      renderNav();
      renderCatalog();
    }

    document.getElementById('langToggle').onclick = () => { state.lang = state.lang === "fa" ? "en" : "fa"; updateUI(); if (state.currentView === 'home') renderItems(); else renderCatalog(); };
    document.getElementById('catalogSearch').oninput = (e) => { state.catalogSearch = e.target.value; renderCatalog(); };

    updateUI();
    showHome();
  </script>
</body>
</html>
